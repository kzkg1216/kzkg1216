<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%">
  <defs>
    <!-- 背景のグラデーション -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <!-- ネオンゴローエフェクト -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景矩形 -->
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- 流れるビル（都市景観）のアニメーショングループ -->
  <g opacity="0.3" filter="url(#glow)" fill="none" stroke="#00C2FF" stroke-width="0.5">
    <!-- ビルのシルエットパターンを定義 -->
    <g id="city">
      <path d="M0,100 H10 V70 H20 V80 H30 V60 H40 V90 H50 V75 H60 V85 H70 V65 H80 V95 H90 V70 H100 V80 H110 V60 H120 V90 H130 V75 H140 V85 H150 V65 H160 V95 H170 V100" />
      <rect x="180" y="50" width="20" height="70" rx="1" />
      <rect x="210" y="65" width="15" height="55" rx="1" />
      <path d="M230,100 H240 V55 H255 V65 H265 V45 H275 V85 H285 V70 H295 V90 H300 V100" />
      <rect x="310" y="55" width="25" height="65" rx="1" />
      <rect x="345" y="70" width="18" height="50" rx="1" />
      <path d="M370,100 H380 V60 H390 V75 H400 V50 H410 V80 H420 V65 H430 V90 H440 V75 H450 V85 H460 V65 H470 V95 H480 V70 H490 V80 H500 V100" />
    </g>
    <!-- シームレスなループのためにパターンをもう一つ並べる -->
    <use href="#city" x="500" />
    
    <!-- アニメーション: 右から左へゆっくり移動（10秒） -->
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="10s" repeatCount="indefinite" />
  </g>

  <!-- スクロールするサイバーグリッド -->
  <g opacity="0.6">
    <line x1="0" y1="120" x2="800" y2="120" stroke="#00C2FF" stroke-width="1" filter="url(#glow)"/>
    <line x1="0" y1="130" x2="800" y2="130" stroke="#00C2FF" stroke-width="2" filter="url(#glow)"/>
    <line x1="0" y1="145" x2="800" y2="145" stroke="#00C2FF" stroke-width="3" filter="url(#glow)"/>
    
    <g stroke="#00C2FF" stroke-width="1.5" filter="url(#glow)">
      <path d="M0 120 L-30 150 M50 120 L20 150 M100 120 L70 150 M150 120 L120 150 M200 120 L170 150 M250 120 L220 150 M300 120 L270 150 M350 120 L320 150 M400 120 L370 150 M450 120 L420 150 M500 120 L470 150 M550 120 L520 150 M600 120 L570 150 M650 120 L620 150 M700 120 L670 150 M750 120 L720 150 M800 120 L770 150 M850 120 L820 150" />
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-50 0" dur="0.4s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- シンプルな自転車アイコン -->
  <g fill="#3DDC84" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" from="-100 0" to="900 0" dur="10s" repeatCount="indefinite" />
    <g>
      <!-- 走行時の細かな振動 -->
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1.5; 0 0" dur="0.3s" repeatCount="indefinite" />
      <path d="M15.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM5 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5zm5.8-10l2.4-2.4.8.8c1.3 1.3 3 2.1 5.1 2.1V9c-1.5 0-2.7-.6-3.6-1.5l-1.9-1.9c-.5-.4-1-.6-1.6-.6s-1.1.2-1.4.6L7.8 8.4c-.4.4-.6.9-.6 1.4 0 .6.2 1.1.6 1.4L11 14v5h1.5v-5.5L10.8 12zM19 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5z" transform="scale(2) translate(0, 42)"/>
    </g>
  </g>
</svg>
